interface:
  display_name: "덕테이프 포스터"
  short_description: "전체 스타일·본문 흐름·서체를 설계해 서로 다른 다섯 포스터 제작"
  default_prompt: "Use $ducttape-poster to draw on collected ideas about what makes studio and Canva designs compelling, prioritize five distinct style identities for my actual content through authored image expression and editing, color and contrast, typographic voice, material and finish, and mood; makers may share a good readable Title/body order and alignment while choosing a suitable composition for each style. Assign one direction to each maker within available concurrency. Do not make fresh web research or source-artwork re-opening a mandatory step for every request or maker. Inspect user-supplied references as needed to honor their actual role. Prioritize a strong first generation: connect each visual entry point to meaningful body-copy groups and the next useful information through concrete alignment, proximity, image direction and contrast. Budget a readable body size and the area for actual sentences at the intended display scale before enlarging the headline or subject. Specify mature Korean/Latin body letterforms, weight, line width, wrapping and spacing alongside the image and headline; keep body typesetting precise even when imagery is rough. Design hierarchy among the copy roles actually present: Title-only needs only its Title, and Title plus body needs those two roles without invented eyebrow, subtitle, footer, dates or URLs. Preserve my full copy and conditions, then inspect the actual images for readability, visible defects and style diversity without requiring five unique layouts. Exclude passive solid-field headline/information templates, including image or room-render dressing of the same arrangement; do not adopt an excluded result as a finished option."
