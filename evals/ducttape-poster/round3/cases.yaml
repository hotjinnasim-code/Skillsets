version: 3
suite_id: ducttape-poster-round3-live-new-production
language: ko
data_status: fictional
note: >-
  모든 행사, 기관, 제품, 장소, 주소와 연락처는 가상의 평가 입력이다.
  example 도메인은 외부 서비스를 열거나 실제 예약을 받기 위한 주소가 아니다.
  실제 로고, 표지, 제품 사진을 가져올 필요가 없다.
scope:
  live_new_production_cases: 4
  initial_image_count: 11
  same_brief_old_commit_comparison:
    case_id: garden-title-only
    additional_initial_image_count: 5
    comparison_slots: [B-G01, B-G02, B-G03, B-G04, B-G05]
    requirement: "이전 커밋의 스킬로 같은 request와 동일한 카피/조건을 새로 실행한다. 후보 결과와 방향 설명은 제공하지 않는다."
    maximum_post_initial_calls_per_image_slot: 0
    maximum_comparison_call_count: 5
  initial_calls: "각 최종 방향을 별도의 image_gen 호출로 신규 생성한다."
  maker_packet: >-
    최초 기존 버전/후보A는 해당 스킬 사본과 case.request 원문만 전달한다.
    후보B는 실제 병렬 제작 구조를 검사하므로 중앙에서 전체 방향을 설계한 뒤
    원문, 전체 카피와 조건, 배정된 한 방향을 각 제작자에게 준다.
    두 실행은 제작 구조까지 달라 지침 변경만의 인과효과를 분리하지 않는다.
  maker_packet_excludes:
    - "purpose, coverage, invariants와 판정 기준"
    - "다른 제작자의 결과/프롬프트, 예상 점수, 평가자의 취향과 개선 결론"
  default_behavior_case: garden-title-only
  new_assets_required: false
  parallel_confirmation:
    frozen_skill: snapshots/candidate-b/SKILL.md
    fresh_image_count: 11
    direction_per_maker: true
    default_case_distinct_makers: 5
    maximum_concurrent_makers_in_this_environment: 3
    accounting: "후보B의 새 생성도 최초 슬롯의 첫 후속 시도로 센다. 이후 마지막 보정 한 번만 남는다."
bounded_loop:
  maximum_optimization_rounds: 2
  maximum_post_initial_calls_per_image_slot: 2
  total_post_initial_call_cap: 22
  total_image_generation_call_cap: 33
  comparison_inclusive_initial_image_count: 16
  comparison_inclusive_total_call_cap: 38
  accounting: >-
    11개의 최초 이미지 슬롯을 유지한다. 최초 생성 이후의 국소 수정, 재생성,
    새 스킬 후보로 해당 방향을 다시 실행하는 targeted retry를 모두 그 슬롯의
    최대 두 번 한도에 포함한다. 실패한 도구 호출도 시도 수와 실제 출력 수를
    구별하여 기록한다. 슬롯을 새 이름으로 만들며 한도를 초기화하지 않는다.
  targeting: >-
    각 라운드 전에 관찰된 실패, 바꿀 지침, 다시 실행할 슬롯과 목적을 기록한다.
    단순한 미적 탐색이나 높은 점수를 얻기 위한 재추첨은 하지 않는다.
    최대 한도를 모두 사용해야 하는 것은 아니다.
  termination: >-
    두 라운드나 슬롯별 두 번 중 먼저 도달한 한도를 지킨다.
    남은 오류는 구체적으로 보고하며 추가 자동 라운드를 열지 않는다.
  final_count: 11
  version_claims: >-
    여러 스킬 버전의 최선 이미지를 섞은 최종 묶음은 선별 결과로 표시한다.
    후보 스킬로 일부 슬롯만 재실행했으면 마지막 스킬의 11장 전체 성능을
    검증했다고 말하지 않는다.
common_mandatory_invariants:
  - id: independent-flat-images
    requirement: "각 슬롯은 텍스트와 디자인이 함께 있는 한 장의 평면 포스터다."
    verification: "개별 반환 파일과 실제 이미지를 확인한다. 패널, 콘택트시트, 비교 번호, 목업은 최종 수량에 세지 않는다."
  - id: exact-visible-copy
    requirement: "각 case.copy의 모든 문구를 정확히 한 번 보존하며 문구를 발명하지 않는다."
    verification: >-
      원본에서 사람이 문구 전체를 대조한다. 철자, 띄어쓰기, 숫자, 대소문자,
      문장부호를 확인한다. 지정되지 않은 줄바꿈은 어절 경계에서 허용한다.
      OCR은 보조로만 쓰며 판독 불확실성은 통과로 처리하지 않는다.
  - id: complete-no-invented-copy
    requirement: "추가 슬로건, 가격, 행사 정보, 가짜 미세 문자, 로고, 워터마크가 없다."
    verification: "copy 목록 밖의 읽을 수 있는 문자와 글자처럼 보이는 장식 흔적을 원본에서 검사한다."
  - id: ratio
    requirement: "각 슬롯의 지정 비율 또는 기본 비율을 지킨다."
    verification: "반환 파일의 실제 너비/높이와 요구 비율의 상대 오차가 1% 이내인지 계산한다."
  - id: original-resolution-reporting
    requirement: "실제 반환 픽셀 크기를 기록하고 리사이즈를 원본 해상도로 부르지 않는다."
    verification: "원본 파일 메타데이터와 전달 기록을 대조한다. 도구로 확인되지 않은 최대 해상도를 달성했다고 주장하지 않는다."
  - id: independent-directions
    requirement: "요청 수량의 독립적인 대안이 있으며 색상이나 필터 변경만으로 수량을 채우지 않는다."
    verification: >-
      원문과 결과만 본 독립 평가자가 두 시안의 내용 표현, 글자 역할, 공간 구조,
      이미지 표현 중 실질적인 차이를 위치와 함께 설명할 수 있어야 한다.
      요청하지 않은 캠페인 통일성은 통과 조건으로 추가하지 않는다.
review_protocol:
  minimum_independent_reviewers: 2
  reviewer_independence: "제작과 스킬 수정에 참여하지 않은 평가자들이 먼저 서로의 판정 없이 보고서를 작성한다."
  blinded_packet: "원문 request, copy, 익명 파일 식별자, 실제 원본, 같은 방식의 축소본만 전달한다."
  hide_until_independent_reports_complete:
    - "스킬 버전과 파일의 생성 순서"
    - "내부 프롬프트, 제작자의 방향 설명과 자기 점수"
    - "채택하려는 결과와 다른 평가자의 결론"
  view_sizes:
    overview: "긴 변 320 px, 원본 비율 유지"
    usage: "너비 720 px, 원본 비율 유지"
    native: "실제 원본 픽셀, 필요한 부분만 확대하여 획과 경계를 확인"
  copy_pass: >-
    원본에서 전체 카피와 모든 필수 조건을 별도로 대조한다.
    사용 크기에서 제공된 세부 정보가 읽혀야 하며 축소 보기는 첫 시선 판단에 쓴다.
    화면에서 확인한 결과를 인쇄 품질 검증으로 확대하지 않는다.
  visual_rubric: "현재 references/evaluation-loop.md의 일곱 시각 항목과 별도의 세트 다양성을 사용한다."
  high_end_candidate_gate: >-
    모든 필수 조건을 통과하고 모든 최종 이미지의 내용과 형태, 타이포그래피,
    이미지와 재질, AI 슬롭 방지 항목 각각에 실제로 보이는 4–5 수준의 근거가
    있어야 한다. 나머지 시각 항목도 각각 평가하며 분명한 미완성을 숨기지 않는다.
    모든 세트의 다양성도 4–5여야 한다.
    한 장의 최고 점수나 평균으로 다른 이미지의 약점, 카피 오류, 조건 위반을 덮지 않는다.
    평가자 간 차이는 유지하고 해결되지 않은 구체적 지적을 보고한다.
  style_fairness: >-
    특정 효과의 유무를 시각 품질 점수로 대체하지 않는다. 제목-only, 긴 안내,
    제품 사진 사례에 기대하는 스타일 목록은 없다. 명시적으로 요구한 3D,
    크롬과 네온은 제거하면 사용자 조건 위반이다. 불필요한 합성 장식과
    범용적인 효과 패키지는 해당 위치와 메시지/마감에 미치는 영향으로 판단한다.
cases:
  - id: garden-title-only
    purpose: "제목만 주어졌을 때 기본 다섯 독립 이미지와 주제별 글자/이미지 관계"
    coverage:
      - "수량, 비율, 스타일을 묻지 않고 기본값으로 실행"
      - "짧은 한글 제목의 정확성, 제목에서 도출한 내용과 형태의 연결"
      - "다섯 대안의 표현 체계와 구성 원리 차이"
    request: |
      덕테이프 포스터. 문구는 '밤에 피는 정원'만 넣어줘.
    copy:
      - "밤에 피는 정원"
    expected_final_count: 5
    slots:
      - {id: G01, ratio: "2:3"}
      - {id: G02, ratio: "2:3"}
      - {id: G03, ratio: "2:3"}
      - {id: G04, ratio: "2:3"}
      - {id: G05, ratio: "2:3"}
    invariants:
      - id: G-count-default
        requirement: "수량을 따로 요청하지 않았으므로 최종 독립 이미지와 개별 파일은 정확히 5개다."
        verification: "원본과 보정본의 대응을 확인하고 방향별 최종 파일 하나씩만 센다."
      - id: G-ratio-default
        requirement: "별도 비율 지시가 없으므로 다섯 장 모두 세로 2:3이다."
        verification: "G01–G05의 실제 픽셀 비율을 계산한다."
      - id: G-title-only
        requirement: "표시 카피는 밤에 피는 정원 한 문구뿐이며 행사 종류, 날짜, 장소, 영문을 만들지 않는다."
        verification: "각 원본의 모든 문자와 글자처럼 보이는 흔적을 대조한다."
      - id: G-full-default-batch
        requirement: "다섯 방향 모두 완성하고 전달한다. 이미지 한 장 안에 여러 시안을 합치지 않는다."
        verification: "실제 독립 신규 호출 5회와 최종 파일 5개, 채팅의 개별 이미지 전달을 대조한다."
      - id: G-diversity
        requirement: "다섯 장이 같은 구성의 색상/질감 변경 수준을 넘어선다."
        verification: "익명 세트로 두 평가자가 표현과 공간/글자의 차이를 설명하고 다양성 점수를 각각 기록한다."

  - id: coast-cleanup-dense-action
    purpose: "긴 한글 안내의 완전성, 모집 행동의 명료성, 세로와 가로에서의 재구성"
    coverage:
      - "긴 안내의 누락/축약과 하단 미세 문자화 검출"
      - "신청 기한과 주소가 읽는 경로에 포함되는지 확인"
      - "두 비율 요청을 정확히 총 두 장으로 배분"
    request: |
      덕테이프 포스터로 해안 정화 참여자를 모집하는 온라인 포스터를 만들어줘.
      총 2장, 세로 2:3 한 장과 가로 3:2 한 장이 필요해.
      신청 기한과 신청 주소를 찾기 쉬워야 해. 아래 문구를 빠짐없이 그대로 넣어줘.
      우리 바다, 함께 줍는 토요일
      하람 해변 정화 참여자 모집
      2026년 11월 21일 토요일
      오전 9시 30분 집결 · 낮 12시 종료
      하람시 물결마당 앞 · 파도길 8
      대상: 만 14세 이상 누구나 · 선착순 40명
      집게와 수거 봉투는 제공됩니다.
      개인 장갑, 마실 물, 모자를 준비해 주세요.
      우천 시 취소되며 신청자에게 전날 문자로 안내합니다.
      참가비 무료 · 봉사 확인서는 발급하지 않습니다.
      11월 18일까지 신청: haram-wave.example/join
      문의: 바다정화 운영팀
    copy:
      - "우리 바다, 함께 줍는 토요일"
      - "하람 해변 정화 참여자 모집"
      - "2026년 11월 21일 토요일"
      - "오전 9시 30분 집결 · 낮 12시 종료"
      - "하람시 물결마당 앞 · 파도길 8"
      - "대상: 만 14세 이상 누구나 · 선착순 40명"
      - "집게와 수거 봉투는 제공됩니다."
      - "개인 장갑, 마실 물, 모자를 준비해 주세요."
      - "우천 시 취소되며 신청자에게 전날 문자로 안내합니다."
      - "참가비 무료 · 봉사 확인서는 발급하지 않습니다."
      - "11월 18일까지 신청: haram-wave.example/join"
      - "문의: 바다정화 운영팀"
    expected_final_count: 2
    slots:
      - {id: C01, ratio: "2:3"}
      - {id: C02, ratio: "3:2"}
    invariants:
      - id: C-count-and-ratio
        requirement: "최종 파일은 총 2개이고 세로 2:3 하나, 가로 3:2 하나다."
        verification: "파일 수와 실제 픽셀 비율을 확인한다. 비율×스타일 조합으로 수량을 늘리지 않는다."
      - id: C-dense-copy
        requirement: "12개 문구 전체를 보존하며 우천, 준비물, 대상, 비용, 확인서 조건을 축약하지 않는다."
        verification: "각 원본에서 12개 문구를 전사 대조하고 사용 크기에서 안내 전체의 가독성을 확인한다."
      - id: C-action
        requirement: "두 이미지에서 신청 기한 11월 18일과 신청 주소 haram-wave.example/join을 쉽게 찾고 읽을 수 있다."
        verification: >-
          사용 크기에서 두 평가자가 각각 원문을 보지 않고 신청 기한과 주소를 정확히
          읽어 적을 수 있어야 한다. 제목에서 신청 행동까지의 경로를 보이는 근거로 설명한다.
      - id: C-not-same-crop
        requirement: "두 비율에 맞게 카피와 공간을 배분하며 단순 크롭으로 정보를 잘라내지 않는다."
        verification: "전후가 아니라 두 대안으로 평가한다. 제목, 안내, 신청 정보를 원본 경계까지 확인한다."

  - id: foln-product-mixed-copy
    purpose: "한영 혼용 카피와 사진 표현의 제품 형태/재질, 글자와 제품의 통합"
    coverage:
      - "한국어, 영문 대소문자, 단위, 날짜와 URL의 정확성"
      - "실물 촬영 같은 사진 표현을 명시 요청했을 때의 충실도"
      - "사진과 타이포그래피, 제품 경계와 공간의 통합"
    request: |
      덕테이프 포스터로 가상의 접이식 컵 출시 포스터를 만들어줘.
      총 2장이고 두 장 모두 세로 4:5야. 실물 촬영 같은 제품 사진이 들어가야 해.
      제품은 손잡이가 없는 350mL 컵으로, 몸체는 짙은 녹색 실리콘이고 뚜껑은 반투명 흰색이야.
      실제 브랜드나 로고를 쓰지 말고 제품 표면에는 글자를 넣지 마.
