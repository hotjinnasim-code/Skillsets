        verification: "원본에서 전체 전사 대조하며 제품이나 배경의 가짜 미세 문자도 검사한다."
      - id: P-product-photograph
        requirement: "컵을 실물 촬영 같은 사진 표현으로 보여주며 손잡이 없는 형태, 짙은 녹색 몸체, 반투명 흰색 뚜껑을 유지한다."
