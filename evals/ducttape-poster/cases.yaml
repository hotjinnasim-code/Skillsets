version: 1
note: "모든 행사·기관·주소는 가상의 평가 입력이다. 날짜의 실제 개최 여부를 주장하지 않는다."
cases:
  - id: sound-exhibition
    purpose: "한국어 정보 계층, 주제의 구체성, 두 방향의 실질적 차이"
    request: |
      덕테이프 포스터로 독립 음악과 사운드 아트 전시를 위한 포스터를 만들어줘.
      전시장에 걸어도 어울리는 완성도를 원해. 2:3 세로, 인물과 악기 사진 없이
      도시의 틈에서 발견한 소리라는 주제를 시각화해줘. 화려한 색도 절제된 색도 가능해.
      문구는 아래 그대로 써줘. 수량은 2장.
      틈의 소리
      도시의 작은 소리를 듣는 전시
      2026.11.06–11.22
      13:00–20:00 · 월요일 휴관
      성수 기록공간
      서울 성동구 연무장길 18
      무료 입장
      주최: 틈 아카이브
    invariants:
      - "독립된 최종 이미지 2장, 각각 세로 2:3"
      - "공급된 문구의 누락·변형·추가 없음; 인물과 악기 사진 없음"
      - "색상 이외의 이미지 표현·구성 원리·타이포그래피에서 구분 가능"
  - id: sparse-default-five
    purpose: "짧은 카피, 기본 다섯 장, 한 팔레트 안에서의 다양성"
    request: |
      덕테이프 포스터. 독립 출판 행사를 위한 포스터야.
      문구는 '종이의 내일' 한 줄만. 흑백, 세로 2:3.
      실제 책 표지나 로고를 넣지 말고, 종이와 인쇄라는 주제는 드러나게 해줘.
    invariants:
      - "개별 최종 파일 5개; 연락처·날짜·영문·슬로건을 발명하지 않음"
      - "흑백, 세로 2:3, 카피는 종이의 내일"
      - "서로 다른 다섯 표현 체계; 책 표지·로고 없음"
  - id: dense-constrained
    purpose: "긴 한글 카피, 좁은 스타일 조건, 여러 비율의 수량 배분"
    request: |
      덕테이프 포스터로 아래 내용을 만들어줘. 수량은 총 2장,
      세로 2:3 한 장과 정사각 한 장. 두 장 모두 따뜻한 손그림 느낌,
      노랑과 파랑을 써줘. 아래 문구를 줄이지 말아줘.
      우리 동네 수리의 날
      버리지 않고 다시 쓰는 작은 실천
      2026년 12월 5일 토요일
      오전 10시부터 오후 4시까지
      마을 공방 2층 · 서울 마포구 잔다리로 24
      소형 가전 · 의류 · 생활 소품 수리 상담
      부품 비용은 별도이며 모든 물품의 수리를 보장하지 않습니다.
      사전 신청 없이 참여 가능 · 마지막 접수 오후 3시
    invariants:
      - "총 2장만 제작; 비율 조합으로 4장으로 확장하지 않음"
      - "두 장 모두 손그림·노랑·파랑 조건 유지"
      - "긴 안내문도 보존하고 계층·공간 배분으로 읽을 수 있게 처리"
  - id: reference-and-edit
    purpose: "자료 역할 분리와 한 장의 부분 수정"
    setup: "sound-exhibition의 실제 최종 이미지 한 장을 수정 대상으로 첨부한다."
    request: |
      이 이미지에서 날짜만 2026.12.04–12.20으로 바꿔줘.
      다른 문구, 비율, 색, 이미지, 배치는 그대로 유지해줘.
    invariants:
      - "수정 결과 한 장만; 기존 시간·휴관일·주소 등 보존"
      - "실제 수정 대상 전달; 나머지 구성 보존 여부를 이미지로 비교"
      - "수정 불가·참조 미확보를 정확한 재현이라고 주장하지 않음"
