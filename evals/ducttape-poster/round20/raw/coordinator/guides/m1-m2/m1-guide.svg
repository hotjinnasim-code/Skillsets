<text x="64" y="729" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="42" font-weight="600" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">성수 주말 식물 마켓</text>
<text x="64" y="790" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="40" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">2027.06.12–06.13</text>
<text x="64" y="849" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="38" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">토·일 11:00–19:00</text>
<text x="445" y="849" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="38" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">성수 온실마당</text>
