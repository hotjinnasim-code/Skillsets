<text x="64" y="514" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="42" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">작은 화분부터 오래 키운 나무까지 만납니다.</text>
<text x="64" y="572" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="42" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">재배자의 이야기를 듣고,</text>
