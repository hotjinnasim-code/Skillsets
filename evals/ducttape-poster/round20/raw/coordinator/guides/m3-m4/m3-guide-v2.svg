<text x="420" y="303" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="40" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">초록을 고르고, 일상을 가꿉니다.</text>
<text x="420" y="370" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="44" font-weight="600" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">성수 주말 식물 마켓</text>
<text x="420" y="435" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="42" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">2027.06.12–06.13</text>
<text x="972" y="435" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="42" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">토·일 11:00–19:00</text>
<text x="420" y="497" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="40" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">성수 온실마당</text>
<text x="420" y="559" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="40" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">입장 무료 · 분갈이 시연</text>
<text x="972" y="559" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="40" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">식물 구매 시 관리 안내 제공</text>
