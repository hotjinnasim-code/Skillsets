<text x="64" y="578" fill="#202624" font-family='"Apple SD Gothic Neo"' font-size="40" font-weight="500" font-stretch="100%" font-style="normal" xml:space="preserve" style="white-space:pre;font-synthesis:none">토·일 11:00–19:00</text>
